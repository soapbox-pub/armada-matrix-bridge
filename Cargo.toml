[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.90"

[workspace.dependencies]
aes-gcm = "0.10"
base64 = "0.22"
hex = "0.4"
hkdf = "0.12"
nostr = { version = "0.45.5", features = ["std", "os-rng", "nip44"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
