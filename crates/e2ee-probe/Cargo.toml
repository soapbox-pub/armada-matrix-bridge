[package]
name = "e2ee-probe"
version = "0.0.0"
description = "Dev tool: an end-to-end encrypting Matrix client for testing the bridge"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
matrix-sdk = { version = "0.19.1", default-features = false, features = ["e2e-encryption", "sqlite", "bundled-sqlite", "rustls-aws-lc-rs"] }
serde_json.workspace = true
tokio = { version = "1", features = ["full"] }
